name: SBOM Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sbom-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and upload SBOM
        run: |
          pip install sbomgen
          sbomgen scan . --upload \
            --api-key ${{ secrets.SBOM_API_KEY }} \
            --project ${{ github.repository }} \
            --fail-on CRITICAL
